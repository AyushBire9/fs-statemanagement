name: Anecdotes tests check

on:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install anecdotes dependencies
        working-directory: anecdotes
        run: npm install

      - name: Generate reproducible npm lockfile snapshot
        working-directory: anecdotes
        run: |
          echo CHAPTER3_LOCKFILE_BEGIN
          node -e "const fs=require('fs');const s=JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json','utf8')));for(let i=0;i<s.length;i+=3000)console.log('LOCKCHUNK_'+s.slice(i,i+3000))"
          echo CHAPTER3_LOCKFILE_END

      - name: Verify test files exist
        working-directory: anecdotes-tests
        run: node verify-tests-exist.mjs

      - name: Verify tests are not vacuous
        working-directory: anecdotes-tests
        run: node verify-tests-not-vacuous.mjs

      - name: Run unit tests
        working-directory: anecdotes
        run: npm test

      - name: Verify unit tests fail against a broken store
        working-directory: anecdotes-tests
        run: node verify-tests-mutation.mjs
